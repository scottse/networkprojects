router-id 192.168.100.20;
define myas = 65100;

protocol device { }

# Protocol template
template bgp PEERS {
  local as myas;
  rs client;
}

# BGP peers

## peer1
protocol bgp AS65501 from PEERS [
  description "peer1";
  neighbor 192.168.100.30 as 65501;
  ipv4 {
    import all;
    export all;
  };
}

## peer2
protocol bgp AS65502 from PEERS [
  description "peer2";
  neighbor 192.168.100.40 as 65502;
  ipv4 {
    import all;
    export all;
  };
}
