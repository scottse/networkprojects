# global config
AS 65100
router-id 192.168.100.10

# Internet Exchange Point route setting
transparent-as yes

group "route-server-clients" {
    # peering LAN
    neighbor 192.168.100.0/24
}

# disable filtering for the lab
allow to ebgp
allow from ebgp

# communites to where RS route was learned
match from any set large-community local-as:0:neighbor-as
