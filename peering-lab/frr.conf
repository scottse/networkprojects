frr version 10.7.1_git
frr defaults traditional
hostname peer2
service integrated-vtysh-config
!
interface eth1
 ip address 192.168.100.40/24
exit
!
interface lo
 ip address 192.0.2.200/32
exit
!
router bgp 65502
 bgp router-id 192.168.100.40
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor 192.168.100.10 remote-as 65100
 neighbor 192.168.100.20 remote-as 65100
 !
 address-family ipv4 unicast
  network 192.0.2.200/32
  neighbor 192.168.100.10 activate
  neighbor 192.168.100.20 activate
 exit-address-family
exit
!