frr version 10.7.1_git
frr defaults traditional
hostname spine2
service integrated-vtysh-config
!
route-map ALLOW-ALL permit 10
exit
!
interface e1
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
interface e2
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
interface e3
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
interface e4
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
interface lo
 ip address 10.1.255.2/32
exit
!
router bgp 65000
 bgp router-id 10.1.255.2
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor LEAFSWITCH peer-group
 neighbor LEAFSWITCH remote-as external
 neighbor LEAFSWITCH bfd
 neighbor e1 interface peer-group LEAFSWITCH
 neighbor e2 interface peer-group LEAFSWITCH
 neighbor e3 interface peer-group LEAFSWITCH
 neighbor e4 interface peer-group LEAFSWITCH
 !
 address-family ipv4 unicast
  network 10.1.255.2/32
  neighbor LEAFSWITCH activate
  neighbor LEAFSWITCH route-map ALLOW-ALL in
  neighbor LEAFSWITCH route-map ALLOW-ALL out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor LEAFSWITCH activate
  neighbor LEAFSWITCH route-map ALLOW-ALL in
  neighbor LEAFSWITCH route-map ALLOW-ALL out
 exit-address-family
exit
!
