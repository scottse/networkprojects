frr version 10.7.1_git
frr defaults traditional
hostname inet
service integrated-vtysh-config
!
route-map ALLOW-ALL permit 10
exit
!
ip route 0.0.0.0/0 10.10.10.1
!
interface e1
 ip address 10.10.10.250/24
exit
!
interface e2
 ip address 172.16.200.1/30
exit
!
router bgp 65500
 no bgp default ipv4-unicast
 neighbor 172.16.200.2 remote-as 65104
 !
 address-family ipv4 unicast
  neighbor 172.16.200.2 activate
  neighbor 172.16.200.2 default-originate
  neighbor 172.16.200.2 route-map ALLOW-ALL in
  neighbor 172.16.200.2 route-map ALLOW-ALL out
 exit-address-family
exit
!