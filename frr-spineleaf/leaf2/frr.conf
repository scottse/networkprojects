frr version 10.7.1_git
frr defaults traditional
hostname leaf2
service integrated-vtysh-config
!
route-map ALLOW-ALL permit 10
exit
!
vrf tenant1
 vni 10000
exit-vrf
!
interface e1
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
interface e2
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
interface lo
 ip address 10.1.255.4/32
exit
!
router bgp 65101
 bgp router-id 10.1.255.4
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor SPINESWITCH peer-group
 neighbor SPINESWITCH remote-as 65000
 neighbor SPINESWITCH bfd
 neighbor e1 interface peer-group SPINESWITCH
 neighbor e2 interface peer-group SPINESWITCH
 !
 address-family ipv4 unicast
  network 10.1.255.4/32
  neighbor SPINESWITCH activate
  neighbor SPINESWITCH route-map ALLOW-ALL in
  neighbor SPINESWITCH route-map ALLOW-ALL out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor SPINESWITCH activate
  neighbor SPINESWITCH route-map ALLOW-ALL in
  neighbor SPINESWITCH route-map ALLOW-ALL out
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65101 vrf tenant1
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  rd 10.1.255.4:10000
  route-target import 65000:10000
  route-target export 65000:10000
  import vrf route-map ALLOW-ALL
  advertise ipv4 unicast
 exit-address-family
exit
!
