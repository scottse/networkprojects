frr version 10.7.1_git
frr defaults traditional
hostname borderleaf1
service integrated-vtysh-config
!
route-map ALLOW-ALL permit 10
exit
!
vrf tenant1
 vni 10000
exit-vrf
!
interface e1
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
interface e2
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
interface e3
 ip address 172.16.200.2/30
exit
!
interface lo
 ip address 10.1.255.6/32
exit
!
router bgp 65104
 bgp router-id 10.1.255.6
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor SPINESWITCH peer-group
 neighbor SPINESWITCH remote-as 65000
 neighbor SPINESWITCH bfd
 neighbor e1 interface peer-group SPINESWITCH
 neighbor e2 interface peer-group SPINESWITCH
 !
 address-family ipv4 unicast
  network 10.1.255.6/32
  neighbor SPINESWITCH activate
  neighbor SPINESWITCH route-map ALLOW-ALL in
  neighbor SPINESWITCH route-map ALLOW-ALL out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor SPINESWITCH activate
  neighbor SPINESWITCH route-map ALLOW-ALL in
  neighbor SPINESWITCH route-map ALLOW-ALL out
  advertise-all-vni
  default-originate ipv4
 exit-address-family
exit
!
router bgp 65104 vrf tenant1
 neighbor 172.16.200.1 remote-as 65500
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.16.200.1 route-map ALLOW-ALL in
  neighbor 172.16.200.1 route-map ALLOW-ALL out
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  rd 10.1.255.6:10000
  route-target import 65000:10000
  route-target export 65000:10000
 exit-address-family
exit
!
