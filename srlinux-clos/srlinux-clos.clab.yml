name: srlinux-clos
topology:
  nodes:
    spine1:
      kind: nokia_srlinux
      type: ixr-d3l
      image: ghcr.io/nokia/srlinux:latest
    spine2:
      kind: nokia_srlinux
      type: ixr-d3l
      image: ghcr.io/nokia/srlinux:latest
    leaf1:
      kind: nokia_srlinux
      type: ixr-d2l
      image: ghcr.io/nokia/srlinux:latest
    leaf2:
      kind: nokia_srlinux
      type: ixr-d2l
      image: ghcr.io/nokia/srlinux:latest
    leaf3:
      kind: nokia_srlinux
      type: ixr-d2l
      image: ghcr.io/nokia/srlinux:latest
    client1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip addr add 192.168.10.100/24 dev eth1
        - ip route del default
        - ip route add default via 192.168.10.1 dev eth1
    client2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip addr add 192.168.20.100/24 dev eth1
        - ip route del default
        - ip route add default via 192.168.20.1 dev eth1
    client3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip addr add 192.168.30.100/24 dev eth1
        - ip route del default
        - ip route add default via 192.168.30.1 dev eth1
  links:
    - endpoints: [ "spine1:e1-1", "leaf1:e1-49" ]
    - endpoints: [ "spine1:e1-2", "leaf2:e1-49" ]
    - endpoints: [ "spine1:e1-3", "leaf3:e1-49" ]
    - endpoints: [ "spine2:e1-1", "leaf1:e1-50" ]
    - endpoints: [ "spine2:e1-2", "leaf2:e1-50" ]
    - endpoints: [ "spine2:e1-3", "leaf3:e1-50" ]
    - endpoints: [ "leaf1:e1-1", "client1:eth1" ]
    - endpoints: [ "leaf2:e1-1", "client2:eth1" ]
    - endpoints: [ "leaf3:e1-1", "client3:eth1" ]
